@if (service.demande(); as d) {
  <div
    class="fixed inset-0 z-50 flex items-center justify-center bg-brown/40 p-4"
    (click)="annuler()"
  >
    <div
      class="card w-full max-w-md p-5 shadow-flottant sm:p-6"
      (click)="$event.stopPropagation()"
      role="dialog"
      aria-modal="true"
    >
      <h2 class="text-lg font-bold">{{ d.titre }}</h2>
      <p class="mt-2 text-sm text-muted-strong">{{ d.message }}</p>
      @if (d.champ) {
        <label class="mt-4 block text-xs font-semibold text-muted-strong">
          {{ d.champ.libelle }}
          <textarea
            #texte
            class="input mt-1.5 min-h-24"
            (input)="saisie.set(texte.value)"
          ></textarea>
        </label>
      }
      @if (d.notification !== undefined) {
        <app-option-notification
          class="mt-4 block"
          [destinataire]="d.notification"
          [placeholder]="
            d.champ
              ? 'Message joint (facultatif) : par défaut, le texte ci-dessus'
              : 'Message joint (facultatif) : motif, explication…'
          "
          [(valeur)]="notification"
        />
      }
      <div class="mt-6 flex justify-end gap-2">
        <button class="btn-outline" (click)="annuler()">Annuler</button>
        <button
          [class]="d.danger ? 'btn-danger' : 'btn-accent'"
          [disabled]="d.champ?.obligatoire && !saisie().trim()"
          (click)="valider()"
        >
          {{ d.confirmer ?? 'Confirmer' }}
        </button>
      </div>
    </div>
  </div>
}
