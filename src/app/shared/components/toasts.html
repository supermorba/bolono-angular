<div
  class="pointer-events-none fixed inset-x-3 bottom-3 z-50 flex flex-col gap-2 sm:inset-x-auto sm:right-5 sm:bottom-5 sm:w-96"
>
  @for (t of toasts.toasts(); track t.id) {
    <div
      class="pointer-events-auto flex items-start gap-3 rounded-xl border bg-surface p-3.5 text-sm shadow-lg"
      [class]="
        t.type === 'erreur'
          ? 'border-error/30'
          : t.type === 'succes'
            ? 'border-success/30'
            : 'border-line'
      "
      role="status"
    >
      <app-icon
        [name]="t.type === 'erreur' ? 'warning' : t.type === 'succes' ? 'check-circle' : 'info'"
        weight="fill"
        [size]="20"
        [class]="
          t.type === 'erreur' ? 'text-error' : t.type === 'succes' ? 'text-success' : 'text-info'
        "
      />
      <p class="flex-1 text-brown">{{ t.message }}</p>
      <button class="text-muted hover:text-brown" (click)="toasts.fermer(t.id)" aria-label="Fermer">
        <app-icon name="x" [size]="14" />
      </button>
    </div>
  }
</div>
