<div
  class="fixed inset-0 z-40 bg-brown/40 transition-opacity starting:opacity-0"
  (click)="fermer.emit()"
></div>
<div
  class="pointer-events-none fixed inset-0 z-50 flex items-start justify-center overflow-y-auto p-3 sm:items-center sm:p-6"
>
  <div
    class="card pointer-events-auto my-auto shadow-flottant flex max-h-[calc(100dvh-1.5rem)] w-full flex-col transition duration-200 starting:scale-95 starting:opacity-0 sm:max-h-[calc(100dvh-3rem)]"
    [class]="largeur()"
    role="dialog"
    aria-modal="true"
    [attr.aria-label]="titre()"
  >
    <div class="flex items-center justify-between gap-3 border-b border-line px-5 py-4 sm:px-6">
      <h2 class="text-lg font-bold">{{ titre() }}</h2>
      <button
        class="rounded-lg p-1.5 text-muted hover:bg-card hover:text-brown"
        (click)="fermer.emit()"
        aria-label="Fermer"
      >
        <app-icon name="x" [size]="20" />
      </button>
    </div>
    <div class="flex-1 overflow-y-auto px-5 py-5 sm:px-6"><ng-content /></div>
    <div
      class="flex flex-wrap justify-end gap-2 border-t border-line bg-ivory/60 px-5 py-3.5 sm:px-6"
    >
      <ng-content select="[pied]" />
    </div>
  </div>
</div>
